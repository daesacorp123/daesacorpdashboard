<!-- preferences.html - Bisa di-include atau dibuat inline -->
<div id="preferencesPanel" class="preferences-panel">
    <h3><i class="fas fa-cog"></i> Dashboard Settings</h3>
    
    <div class="preference-item">
        <label><i class="fas fa-sync-alt"></i> Refresh Interval</label>
        <select id="refreshInterval">
            <option value="15000">15 seconds</option>
            <option value="30000" selected>30 seconds</option>
            <option value="60000">1 minute</option>
            <option value="300000">5 minutes</option>
        </select>
    </div>
    
    <div class="preference-item">
        <label><i class="fas fa-palette"></i> Theme</label>
        <div class="theme-selector">
            <div class="theme-option theme-light active" data-theme="light"></div>
            <div class="theme-option theme-dark" data-theme="dark"></div>
            <div class="theme-option theme-blue" data-theme="blue"></div>
            <div class="theme-option theme-green" data-theme="green"></div>
        </div>
    </div>
    
    <div class="preference-item">
        <label><i class="fas fa-bell"></i> Alerts</label>
        <label class="switch">
            <input type="checkbox" id="alertsToggle" checked>
            <span class="slider"></span>
        </label>
    </div>
    
    <div class="preference-item">
        <label><i class="fas fa-trash"></i> Data Management</label>
        <button id="clearData" class="btn-small btn-danger">
            Clear Local Data
        </button>
    </div>
    
    <button id="savePreferences" class="btn-primary">
        <i class="fas fa-save"></i> Save Settings
    </button>
</div>

<!-- Settings Button -->
<div class="settings-button" id="settingsToggle">
    <i class="fas fa-cog"></i>
</div>
